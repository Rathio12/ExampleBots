name: Example or wiki request
description: Suggest a new example, feature or wiki page
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: A feature for the bots, a new recipe, or a topic the wiki should explain.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help people learn?
