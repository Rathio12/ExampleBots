name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    name: JavaScript (${{ matrix.bot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot: [01-basic, 02-enhanced, 03-expert]
    defaults:
      run:
        working-directory: javascript/${{ matrix.bot }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: javascript/${{ matrix.bot }}/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} \;
      - name: Tests
        if: matrix.bot == '03-expert'
        run: npm test

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/03-expert/requirements-dev.txt
      - name: Lint
        run: ruff check --select E,F,W,B --ignore E501 python
      - name: Compile all bots
        run: python -m compileall -q python
      - name: Tests
        working-directory: python/03-expert
        run: pytest -q

  csharp:
    name: C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build csharp/01-basic
      - run: dotnet build csharp/02-enhanced
      - run: dotnet test csharp/03-expert
